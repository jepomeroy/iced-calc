[workspace]
members = [".", "calclib"]

[package]
name = "iced-calc"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Iced Desktop Calculator"
repository = "https://github.com/jepomeroy/iced-calc"

[package.metadata.deb]
# Debian package name (what users `apt install`)
name = "iced-calc"
maintainer = "Jon Pomeroy <earl.pomeroy42@gmail.com>"
copyright = "2026, Jon Pomeroy"
# Full license text goes into /usr/share/doc/iced-calc/copyright
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = "A desktop calculator built with Iced and Rust."
# $auto covers directly-linked libs; the rest are dlopen'd at runtime (windowing + GPU).
depends = "$auto, libwayland-client0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxrandr2, libxi6, libegl1 | libvulkan1"
assets = [
    [
        "target/release/iced-calc",
        "usr/bin/iced-calc",
        "755",
    ],
    [
        "resources/app.desktop",
        "usr/share/applications/com.github.jepomeroy.iced-calc.desktop",
        "644",
    ],
    [
        "resources/app.metainfo.xml",
        "usr/share/metainfo/com.github.jepomeroy.iced-calc.metainfo.xml",
        "644",
    ],
    [
        "resources/icons/hicolor/scalable/apps/icon.svg",
        "usr/share/icons/hicolor/scalable/apps/com.github.jepomeroy.iced-calc.svg",
        "644",
    ],
]

[dependencies]
futures-util = "0.3.34"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.4.5"
rust-embed = "8.14.0"
tokio = { version = "1.54.1", features = ["full"] }
calclib = { path = "calclib" }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Accessibility support
    "a11y",
    # About widget for the app
    "about",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
    # Add Wayland support to winit
    "wayland",
    # GPU-accelerated rendering
    "wgpu",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
